[project]
name = "deeparchi-patent-mcp"
version = "1.9.2"
description = "Global patent MCP server — search 1.4B patents via BigQuery + Google Patents. MIT. Agent-native."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    # ★ 必须设上界：mcp 2.x 移除了 lowlevel Server.list_tools()，
    #   本服务用 @server.list_tools() 注册处理器 → 2.x 下启动即 AttributeError。
    "mcp>=1.0.0,<2",
    "google-cloud-bigquery>=3.0.0",
    "pydantic>=2.0.0",
    "requests>=2.28.0",
    "aiohttp>=3.9.0",
    "starlette>=0.37.0",
    "uvicorn>=0.30.0",
    "playwright>=1.40.0",
]

[project.urls]
Homepage = "https://github.com/deeparchi-ai/patent-mcp-server"
Repository = "https://github.com/deeparchi-ai/patent-mcp-server"
Issues = "https://github.com/deeparchi-ai/patent-mcp-server/issues"

[project.scripts]
deeparchi-patent-mcp = "server:cli_main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# ★ packages.find 只收录【包（目录）】，不收顶层模块。
# entry point 指向 `server:cli_main`，而 src/server.py 是模块不是包 →
# 不显式声明 py-modules，装完后 `deeparchi-patent-mcp` 会 ModuleNotFoundError。
package-dir = {"" = "src"}
py-modules = ["server"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
strict = true
python_version = "3.10"
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: tests that require BigQuery connection (run with BIGQUERY_INTEGRATION=1)",
]
